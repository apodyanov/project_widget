[project]
name = "widget"
version = "0.1.0"
description = "Это виджет, который показывает несколько последних успешных банковских операций клиента."
authors = [
    {name = "Andrey Podianov",email = "podyanov82@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv (>=1.1.1,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "pandas-stubs (==2.3.2.250926)"
]

[tool.poetry.dependencies]
pandas = "^2.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.17.1"


[tool.poetry.group.dev.dependencies]
pytest-cov = "^7.0.0"

[tool.flake8]
max-line-length = 119
extend-ignore = "E501,W503,E203,F401"
exclude = ".venv,__pycache__,build,dist,.mypy_cache,.pytest_cache"

[tool.black]
line-length = 119
target-version = ['py313']
exclude = ".git"

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ".venv"
